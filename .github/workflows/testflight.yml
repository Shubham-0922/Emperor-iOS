name: TestFlight

# The signed distribution build: archive, sign for the App Store, upload to TestFlight.
#
# Separate from CI on purpose. CI's simulator suites take hours; this needs none of them and
# runs on the code it is pointed at, so a release does not wait behind (or burn) a full test
# cycle. Run it from the Actions tab (Run workflow) or push a `v*` tag. Never on an ordinary
# push: this is a macOS job, billed at 10x on a private repo, so a build is always asked for.
#
# Secrets (Settings → Secrets and variables → Actions), see docs/RELEASING.md:
#   APPLE_TEAM_ID                       the 10-character team id
#   APPLE_DIST_CERT_P12                 base64 of the Apple Distribution .p12 (cert + key)
#   APPLE_DIST_CERT_PASSWORD            its export password
#   APPLE_PROVISIONING_PROFILE          base64 of the App Store profile for com.emperorailabs.emperor
#   APPLE_WIDGET_PROVISIONING_PROFILE   base64 of the App Store profile for ….emperor.widget
#   APP_STORE_CONNECT_KEY               base64 of the App Store Connect API .p8
#   APP_STORE_CONNECT_KEY_ID            its Key ID
#   APP_STORE_CONNECT_ISSUER_ID         the Issuer ID
# Without the three App Store Connect secrets the signed .ipa is still built and kept as an
# artifact; only the upload is skipped.

on:
  workflow_dispatch:
  push:
    tags: ['v*']

concurrency:
  group: testflight-${{ github.ref }}
  cancel-in-progress: false

jobs:
  testflight:
    name: Archive, sign and upload
    runs-on: macos-15
    env:
      # The names given to the profiles in the developer portal; manual signing refers to them.
      APP_PROFILE: Emperor App Store
      WIDGET_PROFILE: Emperor Widget App Store
    steps:
      - name: Are the signing secrets configured?
        env:
          CERT: ${{ secrets.APPLE_DIST_CERT_P12 }}
          PROFILE: ${{ secrets.APPLE_PROVISIONING_PROFILE }}
          WIDGET: ${{ secrets.APPLE_WIDGET_PROVISIONING_PROFILE }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          missing=""
          [ -n "$CERT" ] || missing="$missing APPLE_DIST_CERT_P12"
          [ -n "$PROFILE" ] || missing="$missing APPLE_PROVISIONING_PROFILE"
          [ -n "$WIDGET" ] || missing="$missing APPLE_WIDGET_PROVISIONING_PROFILE"
          [ -n "$TEAM_ID" ] || missing="$missing APPLE_TEAM_ID"
          if [ -n "$missing" ]; then
            echo "::error::Missing secrets:$missing — see docs/RELEASING.md"
            exit 1
          fi

      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          set -euo pipefail
          latest=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          echo "using $latest"
          sudo xcode-select -s "$latest"
          xcodebuild -version

      - name: Install tools
        run: brew install xcodegen xcbeautify

      # A throwaway keychain, not the login one: the runner is destroyed afterwards, and this
      # keeps the private key out of any shared store even so.
      - name: Import the certificate and profiles
        env:
          CERT_P12: ${{ secrets.APPLE_DIST_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.APPLE_DIST_CERT_PASSWORD }}
          PROFILE: ${{ secrets.APPLE_PROVISIONING_PROFILE }}
          WIDGET: ${{ secrets.APPLE_WIDGET_PROVISIONING_PROFILE }}
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password="$(uuidgen)"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"

          echo "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" \
            -P "$CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          rm "$RUNNER_TEMP/cert.p12"
          # Without this, codesign blocks on a GUI prompt that nobody can answer and the job
          # hangs until it times out.
          security set-key-partition-list -S apple-tool:,apple: -k "$password" "$keychain"
          security list-keychain -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning "$keychain"

          # Xcode 16 reads profiles from the first path, older ones from the second.
          for dir in ~/Library/Developer/Xcode/UserData/Provisioning\ Profiles ~/Library/MobileDevice/Provisioning\ Profiles; do
            mkdir -p "$dir"
            echo "$PROFILE" | base64 --decode > "$dir/emperor-app.mobileprovision"
            echo "$WIDGET" | base64 --decode > "$dir/emperor-widget.mobileprovision"
          done

      # Signing settings exist only on this runner. project.yml stays unsigned so the CI
      # builds, the sideload .ipa and anyone generating the project without the certificate
      # are unaffected; here the app and its widget each get their own App Store profile.
      - name: Generate the project, signed for distribution
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          for pair in "emperor:$APP_PROFILE" "emperor.widget:$WIDGET_PROFILE"; do
            id="com.emperorailabs.${pair%%:*}"
            profile="${pair#*:}"
            perl -0pi -e "s/^( +)PRODUCT_BUNDLE_IDENTIFIER: \Q$id\E\n/\$1PRODUCT_BUNDLE_IDENTIFIER: $id\n\$1CODE_SIGN_STYLE: Manual\n\$1CODE_SIGN_IDENTITY: \"Apple Distribution\"\n\$1DEVELOPMENT_TEAM: $TEAM_ID\n\$1PROVISIONING_PROFILE_SPECIFIER: \"$profile\"\n/m" project.yml
          done
          grep -c 'PROVISIONING_PROFILE_SPECIFIER' project.yml | grep -qx 2
          xcodegen generate

      # Both targets carry the same build number (App Store validation refuses a pair that
      # differ); the run number keeps every upload unique and increasing. The offset clears the
      # builds already uploaded from the repository's earlier home, whose run numbers started at 1.
      - name: Archive
        run: |
          set -o pipefail
          xcodebuild archive \
            -project Emperor.xcodeproj \
            -scheme Emperor \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/Emperor.xcarchive \
            CURRENT_PROJECT_VERSION=$(( ${{ github.run_number }} + 100 )) \
            | xcbeautify --renderer github-actions

      - name: Export a signed .ipa
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          cat > build/ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.emperorailabs.emperor</key><string>$APP_PROFILE</string>
              <key>com.emperorailabs.emperor.widget</key><string>$WIDGET_PROFILE</string>
            </dict>
            <key>uploadSymbols</key><true/>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath build/Emperor.xcarchive \
            -exportPath build/export \
            -exportOptionsPlist build/ExportOptions.plist
          ls -la build/export

      - uses: actions/upload-artifact@v4
        with:
          name: Emperor-signed-ipa
          path: build/export/Emperor.ipa
          retention-days: 30

      # An App Store Connect API key, not an Apple ID password: it is revocable, scoped, and
      # unaffected by two-factor auth — which would otherwise make an unattended upload
      # impossible.
      - name: Upload to TestFlight
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          KEY: ${{ secrets.APP_STORE_CONNECT_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$KEY" ] || [ -z "$KEY_ID" ] || [ -z "$ISSUER_ID" ]; then
            echo "::warning::App Store Connect API key secrets are not set; the signed .ipa is in the artifacts but was not uploaded."
            exit 0
          fi
          mkdir -p ~/private_keys
          echo "$KEY" | base64 --decode > ~/private_keys/AuthKey_$KEY_ID.p8
          xcrun altool --upload-app \
            --type ios \
            --file build/export/Emperor.ipa \
            --apiKey "$KEY_ID" \
            --apiIssuer "$ISSUER_ID"
